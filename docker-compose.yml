services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      bifrost:
        condition: service_started
      llm-guard:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.17.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "8081:8080"
    env_file: .env
    volumes:
      - ./docker/bifrost/config.json:/app/data/config.json

  llm-guard:
    image: laiyer/llm-guard-api:latest
    ports:
      - "8001:8000"
    environment:
      CONFIG_FILE: /app/scanners.yml
    volumes:
      - ./docker/llm-guard/scanners.yml:/app/scanners.yml
    deploy:
      resources:
        limits:
          memory: 4G
    restart: on-failure

volumes:
  qdrant_data:
  redis_data:
