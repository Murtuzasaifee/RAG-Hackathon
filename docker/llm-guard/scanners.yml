input_scanners:
  - name: PromptInjection
  - name: Anonymize
  - name: Toxicity
  - name: BanTopics
    params:
      topics: ["violence", "self-harm"]
  - name: TokenLimit
    params:
      limit: 4096

output_scanners:
  - name: FactualConsistency
  - name: Sensitive
  - name: NoRefusal
  - name: Relevance
  - name: Deanonymize
