[project]
name = "rag-hackathon"
version = "0.1.0"
description = "Production-grade RAG hackathon backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "hyperlink>=21.0.0",
    "logfire>=4.32.1",
    "msgpack>=1.1.2",
    "openai>=2.33.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "python-multipart>=0.0.27",
    "python-ulid>=3.1.0",
    "qdrant-client[fastembed]>=1.17.1",
    "ragas>=0.3.1",
    "redis>=7.4.0",
    "structlog>=25.5.0",
    "tiktoken>=0.12.0",
    "torch>=2.3.0",
    "transformers>=4.40.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:No logs or spans:logfire._internal.config.LogfireNotConfiguredWarning"]

[tool.ruff]
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[project.scripts]
serve = "rag_hackathon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_hackathon"]
